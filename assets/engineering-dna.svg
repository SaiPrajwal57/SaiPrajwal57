<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="100%" height="100%" style="background:#090d16; font-family:'Inter', system-ui, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2029"/>
      <stop offset="100%" stop-color="#0f131d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="150" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Label -->
  <text x="30" y="32" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="1.5">COGNITIVE PIPELINE ARCHITECTURE</text>
  <text x="970" y="32" fill="#2fd9f4" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" text-anchor="end">[ DETERMINISTIC EXECUTION ]</text>

  <!-- Step 1: RETRIEVE -->
  <g transform="translate(30, 48)">
    <rect width="135" height="72" rx="8" fill="url(#boxGrad)" stroke="#2fd9f4" stroke-width="1.5"/>
    <text x="67.5" y="30" fill="#2fd9f4" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">RETRIEVE</text>
    <text x="67.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Vector + BM25</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 173 84 L 187 84" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="191,84 185,80 185,88" fill="#38bdf8"/>

  <!-- Step 2: RANK -->
  <g transform="translate(195, 48)">
    <rect width="135" height="72" rx="8" fill="url(#boxGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="67.5" y="30" fill="#c084fc" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">RANK</text>
    <text x="67.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Cross-Encoder</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 338 84 L 352 84" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="356,84 350,80 350,88" fill="#c084fc"/>

  <!-- Step 3: VALIDATE -->
  <g transform="translate(360, 48)">
    <rect width="135" height="72" rx="8" fill="url(#boxGrad)" stroke="#4ade80" stroke-width="1.5"/>
    <text x="67.5" y="30" fill="#4ade80" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">VALIDATE</text>
    <text x="67.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Evidence Filter</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 503 84 L 517 84" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="521,84 515,80 515,88" fill="#4ade80"/>

  <!-- Step 4: REASON -->
  <g transform="translate(525, 48)">
    <rect width="135" height="72" rx="8" fill="url(#boxGrad)" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="67.5" y="30" fill="#f43f5e" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">REASON</text>
    <text x="67.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Chain-of-Thought</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 668 84 L 682 84" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="686,84 680,80 680,88" fill="#f43f5e"/>

  <!-- Step 5: GENERATE -->
  <g transform="translate(690, 48)">
    <rect width="135" height="72" rx="8" fill="url(#boxGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="67.5" y="30" fill="#fbbf24" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">GENERATE</text>
    <text x="67.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Grounded Output</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M 833 84 L 847 84" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="851,84 845,80 845,88" fill="#fbbf24"/>

  <!-- Step 6: EVALUATE -->
  <g transform="translate(855, 48)">
    <rect width="115" height="72" rx="8" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57.5" y="30" fill="#38bdf8" font-size="13" font-family="'JetBrains Mono', monospace" font-weight="700" text-anchor="middle">EVALUATE</text>
    <text x="57.5" y="50" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace" text-anchor="middle">Ragas Loop</text>
  </g>
</svg>