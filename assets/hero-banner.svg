<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#090d16; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fd9f4"/>
      <stop offset="100%" stop-color="#00838f"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#673ab7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="180" fill="#2fd9f4" opacity="0.08" filter="blur(50px)"/>
  <circle cx="1050" cy="280" r="200" fill="#673ab7" opacity="0.12" filter="blur(60px)"/>

  <!-- Border Frame -->
  <rect x="15" y="15" width="1170" height="330" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="15" y="15" width="1170" height="330" rx="12" fill="none" stroke="#2fd9f4" stroke-width="1" stroke-dasharray="80 200 400 150" opacity="0.6"/>

  <!-- Corner Accents -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#2fd9f4" stroke-width="3"/>
  <path d="M 1185 35 L 1185 15 L 1165 15" fill="none" stroke="#2fd9f4" stroke-width="3"/>
  <path d="M 15 325 L 15 345 L 35 345" fill="none" stroke="#2fd9f4" stroke-width="3"/>
  <path d="M 1185 325 L 1185 345 L 1165 345" fill="none" stroke="#2fd9f4" stroke-width="3"/>

  <!-- Top Cyber Status Badge -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#00363e" fill-opacity="0.6" stroke="#2fd9f4" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="14" r="4" fill="#64f88a">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#2fd9f4" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="600" letter-spacing="1.5">SYSTEM // ONLINE</text>
  </g>

  <!-- Main Identity Header -->
  <text x="50" y="135" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-1">SAI PRAJWAL R GUPTA</text>
  
  <!-- Subtitle -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" fill="#2fd9f4" font-size="18" font-family="'JetBrains Mono', monospace" font-weight="700" letter-spacing="2">AI/ML ENGINEER  ·  FULL STACK DEVELOPER</text>
  </g>

  <!-- Tagline Quote -->
  <text x="50" y="225" fill="#94a3b8" font-size="18" font-style="italic" font-weight="400">“Building intelligent systems that create real impact.”</text>

  <!-- Tech Focus Chips -->
  <g transform="translate(50, 260)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="100" height="28" rx="6" fill="#1b2029" stroke="#334155" stroke-width="1"/>
    <text x="50" y="18" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">RAG</text>

    <!-- Chip 2 -->
    <rect x="110" y="0" width="110" height="28" rx="6" fill="#1b2029" stroke="#334155" stroke-width="1"/>
    <text x="165" y="18" fill="#c084fc" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">LLMs</text>

    <!-- Chip 3 -->
    <rect x="230" y="0" width="140" height="28" rx="6" fill="#1b2029" stroke="#334155" stroke-width="1"/>
    <text x="300" y="18" fill="#4ade80" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Agentic AI</text>

    <!-- Chip 4 -->
    <rect x="380" y="0" width="160" height="28" rx="6" fill="#1b2029" stroke="#334155" stroke-width="1"/>
    <text x="460" y="18" fill="#f43f5e" font-size="12" font-family="'JetBrains Mono', monospace" text-anchor="middle">Full-Stack AI</text>
  </g>

  <!-- Right Decorative Terminal Graphic -->
  <g transform="translate(820, 55)" opacity="0.85">
    <rect x="0" y="0" width="320" height="230" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#eab308"/>
    <circle cx="52" cy="18" r="5" fill="#22c55e"/>
    <text x="72" y="22" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">prajwal@neural-node:~</text>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#1e293b" stroke-width="1"/>

    <!-- Terminal Output Code -->
    <text x="16" y="60" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace">&gt; init_agent_cluster()</text>
    <text x="16" y="85" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">[OK] FAISS Vector Store Indexing</text>
    <text x="16" y="105" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">[OK] Cross-Encoder Reranker</text>
    <text x="16" y="125" fill="#64748b" font-size="11" font-family="'JetBrains Mono', monospace">[OK] Evidence Validation Gate</text>
    <text x="16" y="150" fill="#a855f7" font-size="12" font-family="'JetBrains Mono', monospace">&gt; compile_pipeline()</text>
    <text x="16" y="175" fill="#4ade80" font-size="11" font-family="'JetBrains Mono', monospace">Status: Grounded &amp; Ready ⚡</text>
    
    <!-- Animated Cursor -->
    <rect x="195" y="165" width="8" height="13" fill="#4ade80">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Mini Telemetry footer -->
    <rect x="16" y="195" width="288" height="22" rx="4" fill="#1e293b" fill-opacity="0.5"/>
    <text x="24" y="210" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">LATENCY: 12ms | PRECISION: 99.4%</text>
  </g>
</svg>